# wiring.yml — WireViz harness for the 2026 two-rig installation
#
# One Pico 2 drives two 300-pixel rigs and one DFPlayer, amplifier and speaker
# (docs/explanation/2026-blueprint.md, section 4.1). Render with `npm run wiring`, which writes
# wiring.svg next to this file; commit both, because GitHub does not render WireViz.
#
# Connections reference pins by number. Lengths are planning values: measure the site before
# cutting, and never exceed 2.7 m from the level shifter to a strip's pixel 1.

connectors:
  # Supplies. Each sits where it is used: the logic and amp supplies by the central enclosure, each
  # rig supply at its injection point, so no 5 V power runs back to the enclosure.
  PSU_L:
    type: Power supply
    subtype: 5 V 3 A, logic only (Pico, DFPlayer, level shifter)
    pinlabels: [+5V, GND]
    notes: By the central enclosure
  PSU_A1:
    type: Power supply
    subtype: 5 V 8 A, rig A pixels 1-150
    pinlabels: [+5V, GND]
    notes: At rig A pixel 1
  PSU_A2:
    type: Power supply
    subtype: 5 V 8 A, rig A pixels 151-300
    pinlabels: [+5V, GND]
    notes: At rig A pixel 151
  PSU_B1:
    type: Power supply
    subtype: 5 V 8 A, rig B pixels 1-150
    pinlabels: [+5V, GND]
    notes: At rig B pixel 1
  PSU_B2:
    type: Power supply
    subtype: 5 V 8 A, rig B pixels 151-300
    pinlabels: [+5V, GND]
    notes: At rig B pixel 151
  PSU_AMP:
    type: Power supply
    subtype: 12 V 5 A, amplifier only
    pinlabels: [+12V, GND]
    notes: By the central enclosure; kept off the 5 V rails because the amp switches noisily

  # Fuses, one on each supply's positive output, mounted at the supply terminal.
  F_L:
    type: Fuse, inline holder
    subtype: 2 A fast-blow
    pinlabels: [IN, OUT]
  F_A1:
    type: Fuse, inline holder
    subtype: 10 A fast-blow
    pinlabels: [IN, OUT]
  F_A2:
    type: Fuse, inline holder
    subtype: 10 A fast-blow
    pinlabels: [IN, OUT]
  F_B1:
    type: Fuse, inline holder
    subtype: 10 A fast-blow
    pinlabels: [IN, OUT]
  F_B2:
    type: Fuse, inline holder
    subtype: 10 A fast-blow
    pinlabels: [IN, OUT]
  F_AMP:
    type: Fuse, inline holder
    subtype: 5 A fast-blow
    pinlabels: [IN, OUT]

  # Central enclosure: buses, controller, level shifter, MP3 player, amplifier.
  TB_5V:
    type: Terminal block
    subtype: 5 V logic bus
    pinlabels: [+5V, +5V, +5V, +5V]
    notes: "1 from F_L, 2 to D1, 3 to DFPlayer, 4 to U1"
  TB_GND:
    type: Terminal block
    subtype: Star ground
    pinlabels: [GND, GND, GND, GND, GND, GND, GND, GND]
    notes: "The one point where every ground meets: logic supply, Pico, DFPlayer, U1, both rigs, amp"
  D1:
    type: Diode
    subtype: 1N5817 Schottky, 1 A 20 V
    pinlabels: [A, K]
    notes: >-
      Soldered at the Pico's VSYS pin. With USB also plugged in, the higher of USB and the logic
      rail powers the Pico and neither feeds the other (Pico 2 datasheet, Powering Pico)
  PICO:
    type: Raspberry Pi Pico 2
    subtype: RP2350, MicroPython
    pins: [6, 7, 20, 21, 22, 36, 38, 39, 40]
    pinlabels: [GP4, GP5, GP15, GP16, GP17, 3V3, GND, VSYS, VBUS]
    notes: >-
      Physical pin numbers. GP4 is UART1 TX to the DFPlayer; GP5 (UART1 RX) is reserved and left
      unwired. VBUS stays unwired so the logic rail never back-feeds a laptop's USB port
    additional_components:
      - type: Capacitor, electrolytic
        subtype: 100 uF 10 V, across VSYS and GND
  U1:
    type: Level shifter
    subtype: 74AHCT125, DIP-14, 5 V supply
    pinlabels: [1OE, 1A, 1Y, 2OE, 2A, 2Y, GND, 3Y, 3A, 3OE, 4Y, 4A, 4OE, VCC]
    loops: [[1, 7], [4, 7], [9, 7], [10, 7], [12, 7], [13, 7]]
    notes: >-
      Output enables are active low, so 1OE and 2OE go to GND. Unused inputs 3A and 4A, and 3OE
      and 4OE, also go to GND: CMOS inputs must not float (TI SCLS256)
    additional_components:
      - type: Capacitor, ceramic
        subtype: 100 nF, across VCC and GND at the chip
  DFP:
    type: DFPlayer Mini
    subtype: MP3 player, 9600 baud UART
    pins: [1, 2, 3, 4, 5, 6, 7, 8]
    pinlabels: [VCC, RX, TX, DAC_R, DAC_L, SPK_1, GND, SPK_2]
    notes: >-
      Line output from DAC_L/DAC_R feeds the amp. SPK_1/SPK_2 is the built-in 3 W speaker driver
      and stays unwired. TX stays unwired: commands are sent without feedback
    additional_components:
      - type: Capacitor, electrolytic
        subtype: 100 uF 10 V, across VCC and GND
  AMP:
    type: Amplifier
    subtype: TPA3118 60 W BTL mono (CANADUINO)
    pinlabels: [+12V, GND, IN+, IN-, OUT+, OUT-]
    notes: Confirm the input terminals against the board's silkscreen before wiring
  SW1:
    type: Push button
    subtype: Momentary, normally open (optional manual trigger)
    pinlabels: ["1", "2"]
    notes: Enable with USE_MANUAL_TRIGGER in main.py
  R_PD:
    type: Resistor
    subtype: 4.7 kohm 1/4 W, GP15 pull-down
    pinlabels: [IN, OUT]
    notes: >-
      Soldered across the Pico's GP15 and GND pins. RP2350 erratum E9 can latch a pad at about
      2 V after it is driven high, which the internal pull-down cannot clear; 8.2 kohm or less can
  R_A:
    type: Resistor
    subtype: 330 ohm 1/4 W, series, rig A data
    pinlabels: [IN, OUT]
    notes: Soldered at rig A's DIN pad, damping reflections on the long run
  R_B:
    type: Resistor
    subtype: 330 ohm 1/4 W, series, rig B data
    pinlabels: [IN, OUT]
    notes: Soldered at rig B's DIN pad, damping reflections on the long run
  R_SUM_L:
    type: Resistor
    subtype: 10 kohm 1/4 W, sums DAC_L into the mono input
    pinlabels: [IN, OUT]
    notes: Soldered at the amp's IN+ terminal
  R_SUM_R:
    type: Resistor
    subtype: 10 kohm 1/4 W, sums DAC_R into the mono input
    pinlabels: [IN, OUT]
    notes: >-
      Soldered at the amp's IN+ terminal. The pair mixes both channels without shorting DAC_L to
      DAC_R; wiring DAC_L to IN+ and DAC_R to IN- would cancel the thunder
  SPK:
    type: Speaker
    pinlabels: [+, "-"]

  # Rigs. Data enters only at pixel 1. The +5V copper is cut between pixels 150 and 151, so each
  # supply feeds only its own half; GND and data stay continuous.
  STRIP_A:
    type: WS2812B strip, rig A
    subtype: 300 pixels, 5 m
    pinlabels: [+5V px1, DIN, GND, +5V px151, GND]
    notes: Pins 1-3 at pixel 1, pins 4-5 at pixel 151. Cut +5V only between pixels 150 and 151
    additional_components:
      - type: Capacitor, electrolytic
        subtype: 1000 uF 10 V, across +5V and GND at each injection point
        qty: 2
  STRIP_B:
    type: WS2812B strip, rig B
    subtype: 300 pixels, 5 m
    pinlabels: [+5V px1, DIN, GND, +5V px151, GND]
    notes: Pins 1-3 at pixel 1, pins 4-5 at pixel 151. Cut +5V only between pixels 150 and 151
    additional_components:
      - type: Capacitor, electrolytic
        subtype: 1000 uF 10 V, across +5V and GND at each injection point
        qty: 2

cables:
  W_LOGIC:
    type: Logic supply lead
    gauge: 22 AWG
    length: 0.3
    colors: [RD, BK]
  W_PICO:
    type: Pico power
    gauge: 22 AWG
    length: 0.2
    colors: [RD, BK]
  W_DFP:
    type: DFPlayer power and command
    gauge: 22 AWG
    length: 0.2
    colors: [RD, BK, YE]
    wirelabels: [VCC, GND, UART1 TX]
  W_U1:
    type: Level shifter power
    gauge: 22 AWG
    length: 0.2
    colors: [RD, BK]
  W_SW:
    type: Manual trigger (optional)
    gauge: 22 AWG
    length: 0.5
    colors: [OG, WH]
  W_SHIFT_IN:
    type: Pico to level shifter
    gauge: 22 AWG
    length: 0.1
    colors: [GN, BU]
    wirelabels: [Rig A data, Rig B data]
  W_DATA_A:
    type: Rig A data and ground pair, twisted
    gauge: 22 AWG
    length: 2.7
    colors: [GN, BK]
    wirelabels: [Data, GND]
    notes: 2.7 m is the maximum from U1 to pixel 1 (about 3 m unbuffered, less 10%)
  W_DATA_B:
    type: Rig B data and ground pair, twisted
    gauge: 22 AWG
    length: 2.7
    colors: [BU, BK]
    wirelabels: [Data, GND]
    notes: 2.7 m is the maximum from U1 to pixel 1 (about 3 m unbuffered, less 10%)
  W_A1:
    type: Rig A supply 1 lead
    gauge: 18 AWG
    length: 0.5
    colors: [RD, BK]
  W_A2:
    type: Rig A supply 2 lead
    gauge: 18 AWG
    length: 0.5
    colors: [RD, BK]
  W_B1:
    type: Rig B supply 1 lead
    gauge: 18 AWG
    length: 0.5
    colors: [RD, BK]
  W_B2:
    type: Rig B supply 2 lead
    gauge: 18 AWG
    length: 0.5
    colors: [RD, BK]
  W_AMP_PWR:
    type: Amp supply lead
    gauge: 18 AWG
    length: 0.3
    colors: [RD, BK]
  W_AUDIO:
    type: Line audio
    gauge: 22 AWG
    length: 0.3
    colors: [WH, RD, BK]
    wirelabels: [DAC_L, DAC_R, GND]
  W_SPK:
    type: Speaker cable
    gauge: 16 AWG
    length: 3
    colors: [RD, BK]
    notes: Planning length; the speaker sits by the central enclosure
  W_AMP_GND:
    type: Amp to star ground
    gauge: 18 AWG
    length: 0.2
    colors: [BK]

connections:
  # Fuses mount on each supply's positive terminal.
  - [PSU_L: [1], -->, F_L: [1]]
  - [PSU_A1: [1], -->, F_A1: [1]]
  - [PSU_A2: [1], -->, F_A2: [1]]
  - [PSU_B1: [1], -->, F_B1: [1]]
  - [PSU_B2: [1], -->, F_B2: [1]]
  - [PSU_AMP: [1], -->, F_AMP: [1]]

  # Logic rail: logic supply through its fuse to the 5 V bus and star ground.
  - [F_L: [2], W_LOGIC: [1], TB_5V: [1]]
  - [PSU_L: [2], W_LOGIC: [2], TB_GND: [1]]
  - [TB_5V: [2], W_PICO: [1], D1: [1]]
  - [D1: [2], -->, PICO: [39]]
  - [TB_GND: [2], W_PICO: [2], PICO: [38]]
  - [TB_5V: [3], W_DFP: [1], DFP: [1]]
  - [TB_GND: [3], W_DFP: [2], DFP: [7]]
  - [PICO: [6], W_DFP: [3], DFP: [2]]
  - [TB_5V: [4], W_U1: [1], U1: [14]]
  - [TB_GND: [4], W_U1: [2], U1: [7]]

  # Optional manual trigger.
  - [PICO: [20, 36], W_SW: [1, 2], SW1: [1, 2]]
  - [R_PD: [1], -->, PICO: [20]]
  - [R_PD: [2], -->, PICO: [38]]

  # Rig data: GP16/GP17 through one level shifter, then a twisted data/ground pair to each strip.
  - [PICO: [21, 22], W_SHIFT_IN: [1, 2], U1: [2, 5]]
  - [U1: [3], W_DATA_A: [1], R_A: [1]]
  - [R_A: [2], -->, STRIP_A: [2]]
  - [TB_GND: [5], W_DATA_A: [2], STRIP_A: [3]]
  - [U1: [6], W_DATA_B: [1], R_B: [1]]
  - [R_B: [2], -->, STRIP_B: [2]]
  - [TB_GND: [6], W_DATA_B: [2], STRIP_B: [3]]

  # Rig power: each supply sits at its injection point.
  - [F_A1: [2], W_A1: [1], STRIP_A: [1]]
  - [PSU_A1: [2], W_A1: [2], STRIP_A: [3]]
  - [F_A2: [2], W_A2: [1], STRIP_A: [4]]
  - [PSU_A2: [2], W_A2: [2], STRIP_A: [5]]
  - [F_B1: [2], W_B1: [1], STRIP_B: [1]]
  - [PSU_B1: [2], W_B1: [2], STRIP_B: [3]]
  - [F_B2: [2], W_B2: [1], STRIP_B: [4]]
  - [PSU_B2: [2], W_B2: [2], STRIP_B: [5]]

  # Amp power, its ground tied to the star ground.
  - [F_AMP: [2], W_AMP_PWR: [1], AMP: [1]]
  - [PSU_AMP: [2], W_AMP_PWR: [2], AMP: [2]]
  - [TB_GND: [8], W_AMP_GND: [1], AMP: [2]]

  # Thunder: DFPlayer line output summed into the mono amp, then one speaker.
  - [DFP: [5], W_AUDIO: [1], R_SUM_L: [1]]
  - [DFP: [4], W_AUDIO: [2], R_SUM_R: [1]]
  - [R_SUM_L: [2], -->, AMP: [3]]
  - [R_SUM_R: [2], -->, AMP: [3]]
  - [TB_GND: [7], W_AUDIO: [3], AMP: [4]]
  - [AMP: [5, 6], W_SPK: [1, 2], SPK: [1, 2]]
